<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body { background: #f2f2f2; }
		.header {
			background-color: #3d5a40;
			color: white;
			padding: 15px;
			font-size: 20px;
			width: 100%;
		}
		.form-box {
			background-color: #ffffff;
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.08);
		}
		.input-gray {
			background-color: #eaeaea;
			border: none;
		}
	</style>
</head>

<body>

<div class="header d-flex justify-content-between">
	<span>Login</span>
</div>

<div class="container mt-5" style="max-width: 520px;">
	<div class="form-box">

		<h5 class="mb-4">Acessar o sistema</h5>

		<!--
			SecurityConfig:
			- loginPage("/login")
			- formLogin padrão usa POST /login
			- csrf está disable(), então NÃO precisa do token CSRF no form
			- parâmetros padrão: username e password
		-->
		<form th:action="@{/login}" method="POST">

			<label class="form-label">Login</label>
			<input type="text"
				   name="username"
				   class="form-control input-gray mb-3"
				   required>

			<label class="form-label">Senha</label>
			<input type="password"
				   name="password"
				   class="form-control input-gray mb-3"
				   required>

			<button type="submit" class="btn btn-success w-100 mt-2">
				Entrar
			</button>

		</form>

	</div>
</div>

</body>
</html>
